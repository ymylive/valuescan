services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: valuescan-backend
    restart: unless-stopped
    ports:
      - "8081:5000"
    volumes:
      - ./data:/app/data
      - ./signal_monitor:/app/signal_monitor
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    networks:
      - valuescan-network

  monitor:
    image: valuescan-backend
    container_name: valuescan-monitor
    restart: unless-stopped
    command: ["python", "-m", "signal_monitor.ai_signal_scheduler"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./signal_monitor:/app/signal_monitor
      - ./.env:/app/.env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    networks:
      - valuescan-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: valuescan-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - valuescan-network

  nginx:
    image: nginx:alpine
    container_name: valuescan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - valuescan-network

networks:
  valuescan-network:
    driver: bridge
