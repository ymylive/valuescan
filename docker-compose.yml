services:
  nofx-api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-api
    restart: unless-stopped
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}
      - NOFX_LOG_FILE=${NOFX_LOG_FILE:-data/signal_monitor.log}
      - NOFX_API_LOG_FILE=${NOFX_API_LOG_FILE:-data/api.log}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nofx-monitor:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-monitor
    restart: unless-stopped
    command: ["python", "-m", "signal_monitor.ai_signal_scheduler"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}
      - NOFX_LOG_FILE=${NOFX_LOG_FILE:-data/signal_monitor.log}
    depends_on:
      - nofx-api

  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    depends_on:
      - nofx-api
